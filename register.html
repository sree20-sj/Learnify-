<!DOCTYPE html>
<html>
<head>
    <title>Learnify! - Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('https://img.magnific.com/premium-vector/geometric-science-education-background-vector-gradient-blue-digital-remix_53876-125993.jpg?semt=ais_hybrid&w=740&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            padding: 40px 0;
        }

        .form-container {
            background-color: #ffffff;
            padding: 20px;
            border: 1px solid #ccc;
            width: 400px;
            margin: 0 auto;
        }

        h2, h3 {
            color: #333;
            margin-top: 0;
        }

        hr {
            border: 1px solid #ddd;
            margin: 20px 0;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 95%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #007BFF;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Learnify!</h2>
        <h3>Student Registration</h3>

        <hr>

        <form id="regForm" onsubmit="return validateForm(event)">
            <label>Name :</label><br>
            <input type="text" name="name" id="name"><br><br>

            <label>Age :</label><br>
            <input type="number" name="age" id="age"><br><br>

            <label>Select Class :</label><br>
            <select name="course" id="course">
                <option value="">-- Choose Class --</option>
                <option value="Class 1">Class 1</option>
                <option value="Class 2">Class 2</option>
                <option value="Class 3">Class 3</option>
                <option value="Class 4">Class 4</option>
                <option value="Class 5">Class 5</option>
                <option value="Class 6">Class 6</option>
                <option value="Class 7">Class 7</option>
                <option value="Class 8">Class 8</option>
                <option value="Class 9">Class 9</option>
                <option value="Class 10">Class 10</option>
                <option value="Class 11">Class 11</option>
                <option value="Class 12">Class 12</option>
            </select><br><br>

            <label>City :</label><br>
            <input type="text" name="city" id="city"><br><br>

            <label>Email Address :</label><br>
            <input type="text" name="email" id="email"><br><br>

            <label>Create Password :</label><br>
            <input type="password" name="password" id="password"><br><br>

            <button type="submit">Register</button>
        </form>

        <hr>

        <footer>
            <p>Already registered? <a href="login.html">Login here</a></p>
            <p>&copy; 2026 Learnify!</p>
        </footer>
    </div>

    <script>
        async function validateForm(event) {
    if (event) event.preventDefault();

    const formData = {
        name: document.getElementById("name").value.trim(),
        age: document.getElementById("age").value.trim(),
        course: document.getElementById("course").value,
        city: document.getElementById("city").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
    };

    if (!formData.name || !formData.age || !formData.course || !formData.city || !formData.email || !formData.password) {
        alert("All fields must be filled out!");
        return false;
    }

    try {
        // Send data to your Node.js backend server
        const response = await fetch('http://localhost:3000/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });

        const result = await response.json();
        alert(result.message);

        if (result.success) {
            window.location.href = "login.html";
        }
    } catch (error) {
        console.error("Error:", error);
        alert("Could not connect to the server. Make sure server.js is running!");
    }

    return false;
}
    </script>
</body>
</html>
